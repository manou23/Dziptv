name: MESUT IPTV Backend Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesut-backend-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live API and database readiness
        env:
          API_BASE: https://mesut-iptv-api.onrender.com
        run: |
          set -euo pipefail
          echo "Checking API and PostgreSQL readiness..."
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 10 \
            --max-time 35 "$API_BASE/health/ready"


      - name: Test disposable account, device registration, and cloud sync
        env:
          API_BASE: https://mesut-iptv-api.onrender.com
        run: |
          set -euo pipefail
          email="ci-smoke-${GITHUB_RUN_ID}@example.invalid"
          password="$(openssl rand -hex 24)"
          echo "Creating an isolated disposable smoke-test account..."
          registered="$(curl --fail --silent --show-error --max-time 35 \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg email "$email" --arg password "$password" '{email:$email,password:$password}')" \
            "$API_BASE/api/v1/auth/register")"
          token="$(jq -r '.token // empty' <<<"$registered")"
          test -n "$token"

          logged_in="$(curl --fail --silent --show-error --max-time 35 \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg email "$email" --arg password "$password" '{email:$email,password:$password}')" \
            "$API_BASE/api/v1/auth/login")"
          login_token="$(jq -r '.token // empty' <<<"$logged_in")"
          test -n "$login_token"

          device="$(curl --fail --silent --show-error --max-time 35 \
            -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg key "ci-smoke-$GITHUB_RUN_ID" '{deviceKey:$key,name:"CI Smoke Test",platform:"android"}')" \
            "$API_BASE/api/v1/devices/register")"
          device_id="$(jq -r '.device.id // empty' <<<"$device")"
          test -n "$device_id"
          device_list="$(curl --fail --silent --show-error --max-time 35 \
            -H "Authorization: Bearer $login_token" "$API_BASE/api/v1/devices")"
          jq -e --arg id "$device_id" '.devices[] | select(.id == $id)' <<<"$device_list"
          curl --fail --silent --show-error --output /dev/null --max-time 35 \
            -X DELETE -H "Authorization: Bearer $login_token" \
            "$API_BASE/api/v1/devices/$device_id"

          curl --fail --silent --show-error --max-time 35 \
            -X PUT -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg run "$GITHUB_RUN_ID" '{value:{_smokeTest:$run}}')" \
            "$API_BASE/api/v1/sync/settings"

          # Verify the collection metadata record used for deletion-safe sync.
          curl --fail --silent --show-error --max-time 35 \
            -X PUT -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg run "$GITHUB_RUN_ID" '{value:{favorites:($run|tonumber),watch_history:($run|tonumber)}}')" \
            "$API_BASE/api/v1/sync/sync_meta"

          # Empty collections are valid snapshots: clearing data must sync as deletion.
          curl --fail --silent --show-error --max-time 35 \
            -X PUT -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d '{"value":{"live":[],"vod":[],"series":[]}}' \
            "$API_BASE/api/v1/sync/favorites"
          curl --fail --silent --show-error --max-time 35 \
            -X PUT -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d '{"value":[]}' \
            "$API_BASE/api/v1/sync/watch_history"

          records="$(curl --fail --silent --show-error --max-time 35 \
            -H "Authorization: Bearer $login_token" "$API_BASE/api/v1/sync")"
          jq -e --arg run "$GITHUB_RUN_ID" \
            '.records[] | select(.key == "settings") | .value._smokeTest == $run' \
            <<<"$records"
          jq -e --arg run "$GITHUB_RUN_ID" \
            '.records[] | select(.key == "sync_meta") | .value.favorites == ($run|tonumber) and .value.watch_history == ($run|tonumber)' \
            <<<"$records"
          jq -e '.records[] | select(.key == "favorites") | .value.live == [] and .value.vod == [] and .value.series == []' \
            <<<"$records"
          jq -e '.records[] | select(.key == "watch_history") | .value == []' \
            <<<"$records"

      - name: Verify protected sync endpoint rejects anonymous access
        env:
          API_BASE: https://mesut-iptv-api.onrender.com
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/sync-response.json \
            --write-out '%{http_code}' --max-time 35 "$API_BASE/api/v1/sync")"
          cat /tmp/sync-response.json
          test "$status" = "401"
          grep -q '"error":"AUTH_REQUIRED"' /tmp/sync-response.json
