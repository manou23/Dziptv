name: MESUT IPTV Backend Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesut-backend-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live API and database readiness
        env:
          API_BASE: https://mesut-iptv-api.onrender.com
        run: |
          set -euo pipefail
          echo "Checking API and PostgreSQL readiness..."
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 10 \
            --max-time 35 "$API_BASE/health/ready"

          echo "Waiting for the new atomic sync route to reach Render..."
          route_status=""
          for attempt in $(seq 1 12); do
            route_status="$(curl --silent --show-error --output /tmp/batch-route.json \
              --write-out '%{http_code}' --max-time 20 -X POST \
              -H 'Content-Type: application/json' -d '{}' \
              "$API_BASE/api/v1/sync/batch")"
            if [ "$route_status" = "401" ]; then break; fi
            if [ "$route_status" != "404" ]; then
              cat /tmp/batch-route.json
              exit 1
            fi
            sleep 10
          done
          test "$route_status" = "401"


      - name: Test disposable account, device registration, and cloud sync
        env:
          API_BASE: https://mesut-iptv-api.onrender.com
        run: |
          set -euo pipefail
          email="ci-smoke-${GITHUB_RUN_ID}@example.invalid"
          password="$(openssl rand -hex 24)"
          echo "Creating an isolated disposable smoke-test account..."
          registered="$(curl --fail --silent --show-error --max-time 35 \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg email "$email" --arg password "$password" '{email:$email,password:$password}')" \
            "$API_BASE/api/v1/auth/register")"
          token="$(jq -r '.token // empty' <<<"$registered")"
          test -n "$token"

          logged_in="$(curl --fail --silent --show-error --max-time 35 \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg email "$email" --arg password "$password" '{email:$email,password:$password}')" \
            "$API_BASE/api/v1/auth/login")"
          login_token="$(jq -r '.token // empty' <<<"$logged_in")"
          test -n "$login_token"

          device="$(curl --fail --silent --show-error --max-time 35 \
            -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg key "ci-smoke-$GITHUB_RUN_ID" '{deviceKey:$key,name:"CI Smoke Test",platform:"android"}')" \
            "$API_BASE/api/v1/devices/register")"
          device_id="$(jq -r '.device.id // empty' <<<"$device")"
          test -n "$device_id"
          device_list="$(curl --fail --silent --show-error --max-time 35 \
            -H "Authorization: Bearer $login_token" "$API_BASE/api/v1/devices")"
          jq -e --arg id "$device_id" '.devices[] | select(.id == $id)' <<<"$device_list"
          curl --fail --silent --show-error --output /dev/null --max-time 35 \
            -X DELETE -H "Authorization: Bearer $login_token" \
            "$API_BASE/api/v1/devices/$device_id"

          curl --fail --silent --show-error --max-time 35 \
            -X PUT -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg run "$GITHUB_RUN_ID" '{value:{_smokeTest:$run}}')" \
            "$API_BASE/api/v1/sync/settings"

          # Verify the collection metadata record used for deletion-safe sync.
          curl --fail --silent --show-error --max-time 35 \
            -X PUT -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg run "$GITHUB_RUN_ID" '{value:{favorites:{"profile-a":($run|tonumber),"profile-b":(($run|tonumber)+1)},watch_history:{"profile-a":($run|tonumber),"profile-b":(($run|tonumber)+1)}}}')" \
            "$API_BASE/api/v1/sync/sync_meta"

          # Empty snapshots are valid deletions, and records remain isolated per profile.
          curl --fail --silent --show-error --max-time 35 \
            -X PUT -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d '{"value":{"profiles":{"profile-a":{"live":[],"vod":[],"series":[]},"profile-b":{"live":[],"vod":[],"series":[]}}}}' \
            "$API_BASE/api/v1/sync/favorites"
          curl --fail --silent --show-error --max-time 35 \
            -X PUT -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' \
            -d '{"value":{"profiles":{"profile-a":[],"profile-b":[]}}}' \
            "$API_BASE/api/v1/sync/watch_history"

          records="$(curl --fail --silent --show-error --max-time 35 \
            -H "Authorization: Bearer $login_token" "$API_BASE/api/v1/sync")"

          # Exercise the atomic compare-and-swap endpoint used by current clients.
          versions="$(jq -c '[.records[] | {key, version}] | from_entries | with_entries(.value = .value.version)' <<<"$records")"
          batch_body="$(jq -n --argjson versions "$versions" --arg run "$GITHUB_RUN_ID" \
            '{records:{
              settings:{expectedVersion:$versions.settings,value:{_batchSmoke:$run}},
              favorites:{expectedVersion:$versions.favorites,value:{profiles:{}}},
              watch_history:{expectedVersion:$versions.watch_history,value:{profiles:{}}},
              sync_meta:{expectedVersion:$versions.sync_meta,value:{favorites:{},watch_history:{}}}
            }}')"
          curl --fail --silent --show-error --max-time 35 \
            -X POST -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' -d "$batch_body" \
            "$API_BASE/api/v1/sync/batch"

          # Replaying the old versions must return 409 and must not partially write.
          conflict_status="$(curl --silent --show-error --output /tmp/batch-conflict.json \
            --write-out '%{http_code}' --max-time 35 -X POST \
            -H "Authorization: Bearer $login_token" \
            -H 'Content-Type: application/json' -d "$batch_body" \
            "$API_BASE/api/v1/sync/batch")"
          test "$conflict_status" = "409"
          grep -q '"error":"SYNC_VERSION_CONFLICT"' /tmp/batch-conflict.json
          after_conflict="$(curl --fail --silent --show-error --max-time 35 \
            -H "Authorization: Bearer $login_token" "$API_BASE/api/v1/sync")"
          jq -e --arg run "$GITHUB_RUN_ID" \
            '.records[] | select(.key == "settings") | .value._batchSmoke == $run' \
            <<<"$after_conflict"
          jq -e --arg run "$GITHUB_RUN_ID" \
            '.records[] | select(.key == "settings") | .value._smokeTest == $run' \
            <<<"$records"
          jq -e --arg run "$GITHUB_RUN_ID" \
            '.records[] | select(.key == "sync_meta") | .value.favorites["profile-a"] == ($run|tonumber) and .value.favorites["profile-b"] == (($run|tonumber)+1)' \
            <<<"$records"
          jq -e '.records[] | select(.key == "favorites") | .value.profiles["profile-a"].live == [] and .value.profiles["profile-b"].series == []' \
            <<<"$records"
          jq -e '.records[] | select(.key == "watch_history") | .value.profiles["profile-a"] == [] and .value.profiles["profile-b"] == []' \
            <<<"$records"

      - name: Verify protected sync endpoint rejects anonymous access
        env:
          API_BASE: https://mesut-iptv-api.onrender.com
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/sync-response.json \
            --write-out '%{http_code}' --max-time 35 "$API_BASE/api/v1/sync")"
          cat /tmp/sync-response.json
          test "$status" = "401"
          grep -q '"error":"AUTH_REQUIRED"' /tmp/sync-response.json
