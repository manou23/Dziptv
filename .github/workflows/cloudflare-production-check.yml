name: Verify MESUT Cloudflare Pages production

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "README.md"
      - "assets/**"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect official launch content in the committed source
        id: launch
        run: |
          set -euo pipefail
          if grep -Fq 'MESUT IPTV NOVA 8.0.0 متاح الآن' index.html \
            && grep -Fq 'releases/download/v8.0.0/mesut-iptv-phone.apk' index.html \
            && grep -Fq 'releases/download/v8.0.0/mesut-iptv-tv.apk' index.html; then
            echo "launch_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "launch_present=false" >> "$GITHUB_OUTPUT"
            echo "This homepage change does not contain the official launch yet; release verification is skipped."
          fi

      - name: Wait for Cloudflare Pages production update
        if: steps.launch.outputs.launch_present == 'true'
        env:
          SITE_URL: https://mesutiptv.pages.dev/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            html="$(curl --fail --silent --show-error --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "${SITE_URL}?production_check=${GITHUB_SHA}" || true)"
            if grep -Fq 'MESUT IPTV NOVA 8.0.0 متاح الآن' <<<"$html" \
              && grep -Fq 'releases/download/v8.0.0/mesut-iptv-phone.apk' <<<"$html" \
              && grep -Fq 'releases/download/v8.0.0/mesut-iptv-tv.apk' <<<"$html"; then
              echo "Cloudflare Pages is serving the NOVA 8.0.0 launch content."
              exit 0
            fi
            echo "Waiting for Cloudflare Pages deployment ($attempt/24)..."
            sleep 10
          done
          echo "Cloudflare Pages did not expose the expected launch content."
          exit 1

      - name: Verify the stable GitHub release and its four assets
        if: steps.launch.outputs.launch_present == 'true'
        env:
          RELEASE_API: https://api.github.com/repos/manou23/Dziptv/releases/tags/v8.0.0
        run: |
          set -euo pipefail
          release="$(curl --fail --silent --show-error "$RELEASE_API")"
          jq -e '.prerelease == false and .draft == false' <<<"$release" >/dev/null
          for asset in \
            mesut-iptv-phone.apk \
            mesut-iptv-phone.apk.sha256 \
            mesut-iptv-tv.apk \
            mesut-iptv-tv.apk.sha256; do
            jq -e --arg name "$asset" '.assets[] | select(.name == $name and .size > 0)' \
              <<<"$release" >/dev/null
          done
          echo "Stable v8.0.0 release and all four assets are present."

      - name: Verify direct download endpoints
        if: steps.launch.outputs.launch_present == 'true'
        run: |
          set -euo pipefail
          for asset in \
            mesut-iptv-phone.apk \
            mesut-iptv-phone.apk.sha256 \
            mesut-iptv-tv.apk \
            mesut-iptv-tv.apk.sha256; do
            url="https://github.com/manou23/Dziptv/releases/download/v8.0.0/$asset"
            status="$(curl --silent --show-error --location --head --output /dev/null \
              --write-out '%{http_code}' --max-time 60 "$url")"
            test "$status" = "200"
            echo "$asset: HTTP $status"
          done
