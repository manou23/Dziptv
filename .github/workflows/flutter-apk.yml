name: MESUT IPTV Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-apk.yml"
      - ".github/workflows/nova-official-release.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-apk.yml"
      - ".github/workflows/nova-official-release.yml"

permissions:
  contents: write

concurrency:
  group: mesut-iptv-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Build phone APK (ARM64)
        run: >-
          flutter build apk --flavor phone --release --target-platform android-arm64
          --dart-define=MESUT_API_BASE_URL=https://mesut-iptv-api.onrender.com
          --dart-define=MESUT_BUILD_COMMIT=${GITHUB_SHA}
          --dart-define=MESUT_TARGET=phone

      - name: Build Android TV APK (ARM64)
        run: >-
          flutter build apk --flavor tv --release --target-platform android-arm64
          --dart-define=MESUT_API_BASE_URL=https://mesut-iptv-api.onrender.com
          --dart-define=MESUT_BUILD_COMMIT=${GITHUB_SHA}
          --dart-define=MESUT_TARGET=tv

      - name: Prepare separate downloads and checksums
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          cp app-phone-release.apk mesut-iptv-phone.apk
          cp app-tv-release.apk mesut-iptv-tv.apk
          test -s mesut-iptv-phone.apk
          test -s mesut-iptv-tv.apk
          sha256sum mesut-iptv-phone.apk > mesut-iptv-phone.apk.sha256
          sha256sum mesut-iptv-tv.apk > mesut-iptv-tv.apk.sha256
          sha256sum -c mesut-iptv-phone.apk.sha256
          sha256sum -c mesut-iptv-tv.apk.sha256
          unzip -t mesut-iptv-phone.apk >/dev/null
          unzip -t mesut-iptv-tv.apk >/dev/null
          echo "Both APK archives and SHA-256 checksums are valid."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesut-iptv-android-release
          path: |
            build/app/outputs/flutter-apk/mesut-iptv-phone.apk
            build/app/outputs/flutter-apk/mesut-iptv-phone.apk.sha256
            build/app/outputs/flutter-apk/mesut-iptv-tv.apk
            build/app/outputs/flutter-apk/mesut-iptv-tv.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Read app version
        id: app_version
        run: |
          version="$(grep '^version:' pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish rolling direct-download release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MESUT IPTV - NOVA ${{ steps.app_version.outputs.version }} (Android latest)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Automated Android release built from the latest successful main-branch workflow run.

            App version: ${{ steps.app_version.outputs.version }}

            Build commit: ${{ github.sha }}

            Phone APK:
            https://github.com/manou23/Dziptv/releases/download/android-latest/mesut-iptv-phone.apk

            Android TV APK:
            https://github.com/manou23/Dziptv/releases/download/android-latest/mesut-iptv-tv.apk

            This rolling prerelease is updated after each successful APK build.
          files: |
            build/app/outputs/flutter-apk/mesut-iptv-phone.apk
            build/app/outputs/flutter-apk/mesut-iptv-phone.apk.sha256
            build/app/outputs/flutter-apk/mesut-iptv-tv.apk
            build/app/outputs/flutter-apk/mesut-iptv-tv.apk.sha256
