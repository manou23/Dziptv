name: MESUT IPTV Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/flutter-apk.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: mesut-iptv-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK with MESUT API
        run: >-
          flutter build apk --release
          --dart-define=MESUT_API_BASE_URL=https://mesut-iptv-api.onrender.com
          --dart-define=MESUT_BUILD_COMMIT=${GITHUB_SHA}

      - name: Generate APK checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesut-iptv-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MESUT IPTV - Latest Android Build
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Automated Android release built from the latest successful main-branch workflow run.

            Build commit: ${{ github.sha }}

            Direct APK download:
            https://github.com/manou23/Dziptv/releases/download/android-latest/app-release.apk

            This rolling prerelease is updated after each successful APK build.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
