name: MESUT IPTV Flutter V7 CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesut-flutter-v7-ci-final
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Flutter source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Android project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Report Dart formatting drift
        run: dart format --output=none lib

      - name: Run Flutter tests when present
        if: ${{ hashFiles('test/**') != '' }}
        run: flutter test

      - name: Build Android APK with MESUT API
        run: >-
          flutter build apk --debug --flavor phone
          --dart-define=MESUT_API_BASE_URL=https://mesut-iptv-api.onrender.com
          --dart-define=MESUT_BUILD_COMMIT=${GITHUB_SHA}
          --dart-define=MESUT_TARGET=phone

      - name: Upload Flutter APK
        uses: actions/upload-artifact@v4
        with:
          name: MESUT-IPTV-FLUTTER-V7-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
