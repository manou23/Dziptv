name: Publish NOVA versioned release

on:
  workflow_run:
    workflows: ["MESUT IPTV Android APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: nova-official-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact successful build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download verified Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mesut-iptv-android-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Read app version
        id: app_version
        run: |
          version="$(grep '^version:' pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish stable versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: MESUT IPTV - NOVA ${{ steps.app_version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            MESUT IPTV — NOVA ${{ steps.app_version.outputs.version }}

            Official stable Android release.

            App version: ${{ steps.app_version.outputs.version }}

            Build commit: ${{ github.event.workflow_run.head_sha }}

            Phone APK: mesut-iptv-phone.apk
            Android TV APK: mesut-iptv-tv.apk

            SHA-256 checksum files are included for both APKs.
          files: |
            dist/mesut-iptv-phone.apk
            dist/mesut-iptv-phone.apk.sha256
            dist/mesut-iptv-tv.apk
            dist/mesut-iptv-tv.apk.sha256
