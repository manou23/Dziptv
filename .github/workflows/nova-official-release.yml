name: Publish NOVA versioned release

on:
  workflow_run:
    workflows: ["MESUT IPTV Android APK"]
    types: [completed]
  # 17:30 in Algeria (UTC+1) on the official launch date.
  schedule:
    - cron: "30 16 11 11 *"
  # Keep any release created by an older automatic trigger in prerelease
  # status until the official launch window.
  push:
    branches: [main]
    paths:
      - ".github/workflows/nova-official-release.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: nova-official-release
  cancel-in-progress: false

jobs:
  hold_early_release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark any premature NOVA release as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          launch_epoch="$(date -u -d '2026-11-11T16:30:00Z' +%s)"
          now_epoch="$(date -u +%s)"
          if [ "$now_epoch" -lt "$launch_epoch" ]; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v8.0.0" --jq '.id' 2>/dev/null || true)"
            if [ -n "$release_id" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
                -F prerelease=true -F make_latest=false \
                -f body="NOVA 8.0.0 launch candidate. This is a PRE-RELEASE, not the official stable release. The official launch is scheduled for 11 November 2026 at 17:30 Africa/Algiers. The stable release will be published after launch-time validation."
              echo "NOVA 8.0.0 is marked as prerelease until launch."
            fi
          fi

  publish:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Gate official release until scheduled launch
        id: gate
        run: |
          launch_epoch="$(date -u -d '2026-11-11T16:30:00Z' +%s)"
          now_epoch="$(date -u +%s)"
          if [ "$now_epoch" -ge "$launch_epoch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Stable release is held until 17:30 Algeria time."
          fi

      - name: Resolve successful build source
        id: source
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android-latest")"
            body="$(jq -r '.body' <<<"$release_json")"
            sha="$(sed -n 's/^Build commit: //p' <<<"$body" | head -n1)"
            test -n "$sha"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the exact successful build commit
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Confirm NOVA 8.0.0 source version
        if: steps.gate.outputs.allowed == 'true'
        run: |
          version="$(grep '^version:' pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)"
          test "$version" = "8.0.0"
          echo "Verified app version: $version"

      - name: Download APKs from the successful main build
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: mesut-iptv-android-release
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Download APKs from the rolling build release
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download android-latest \
            --pattern 'mesut-iptv-phone.apk' \
            --pattern 'mesut-iptv-phone.apk.sha256' \
            --pattern 'mesut-iptv-tv.apk' \
            --pattern 'mesut-iptv-tv.apk.sha256' \
            --dir dist

      - name: Verify both APKs and SHA-256 checksums
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          for file in \
            mesut-iptv-phone.apk \
            mesut-iptv-phone.apk.sha256 \
            mesut-iptv-tv.apk \
            mesut-iptv-tv.apk.sha256; do
            test -s "dist/$file"
          done
          (cd dist && sha256sum -c mesut-iptv-phone.apk.sha256)
          (cd dist && sha256sum -c mesut-iptv-tv.apk.sha256)

      - name: Read app version
        if: steps.gate.outputs.allowed == 'true'
        id: app_version
        run: |
          version="$(grep '^version:' pubspec.yaml | head -n1 | cut -d' ' -f2 | cut -d'+' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish stable versioned release
        if: steps.gate.outputs.allowed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: MESUT IPTV - NOVA ${{ steps.app_version.outputs.version }}
          target_commitish: ${{ steps.source.outputs.sha }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            MESUT IPTV — NOVA ${{ steps.app_version.outputs.version }}

            Official stable Android release.

            App version: ${{ steps.app_version.outputs.version }}

            Build commit: ${{ steps.source.outputs.sha }}

            Phone APK: mesut-iptv-phone.apk
            Android TV APK: mesut-iptv-tv.apk

            SHA-256 checksum files are included for both APKs.
          files: |
            dist/mesut-iptv-phone.apk
            dist/mesut-iptv-phone.apk.sha256
            dist/mesut-iptv-tv.apk
            dist/mesut-iptv-tv.apk.sha256
