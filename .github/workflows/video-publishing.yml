name: VibeCritic Video Publishing
on:
  workflow_dispatch:
    inputs:
      article_url:
        description: "رابط مقال منشور في VibeCritic (اتركه فارغاً للاختيار الآلي)"
        required: false
        type: string
      video_format:
        description: "نوع الفيديو المطلوب"
        required: true
        type: choice
        options:
          - both
          - short
          - long
        default: both
  schedule:
    - cron: "30 10,18 * * *"
permissions:
  contents: write
concurrency:
  group: vibecritic-video-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate and publish
        env:
          # Production mode: generate and upload approved videos to YouTube.
          DRY_RUN: '0'
          MANUAL_ARTICLE_URL: ${{ inputs.article_url }}
          VIDEO_FORMAT: ${{ inputs.video_format || 'both' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          # Free-only script fallback; the paid OpenAI path remains explicitly disabled.
          BAZAARLINK_API_KEY: ${{ secrets.BAZAARLINK_API_KEY }}
          ALLOW_PAID_OPENAI: '0'
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: public
          TTS_VOICE: ar-SA-HamedNeural
        run: python main.py
      - name: Upload generated preview files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibecritic-published-video-files-${{ github.run_number }}
          path: |
            output/*.mp4
            output/metadata.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Save publishing state
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "chore(video): update publishing state"
          git push
