name: mesut_iptv
description: Mesut IPTV player for Xtream Codes
publish_to: 'none'
version: 7.0.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  wakelock_plus: ^1.2.10
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#14103A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
